name: harvest

on:
  schedule:
    # Four times a day, off the hour: the upstream registers move on their own
    # schedule and there is nothing to gain from arriving with everyone else.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bring in the crop
        id: crop
        run: python3 harvest.py

      # Two different things can move.  A new catalogue is a new season and
      # earns a tag and a release; the inherited profile drifting on its own
      # only earns a commit, because there is no new file to publish and the
      # existing tag must keep resolving.
      - name: Record the season
        if: steps.crop.outputs.changed == 'true' || steps.crop.outputs.relinked == 'true'
        env:
          NEW_CROP: ${{ steps.crop.outputs.changed }}
        run: |
          set -euo pipefail
          stamp="$(python3 -c "import json;print(json.load(open('seed-sources.lock'))['harvested'])")"
          count="$(python3 -c "import json;print(json.load(open('seed-sources.lock'))['catalogue']['whitelist'])")"
          echo "stamp=$stamp" >> "$GITHUB_ENV"
          echo "count=$count" >> "$GITHUB_ENV"
          git config user.name wyrtensi
          git config user.email wyrtensi@users.noreply.github.com
          git add seed-catalog.dat HARVEST.LINK seed-sources.lock
          if [ "$NEW_CROP" = "true" ]; then
            git commit -m "harvest $stamp: $count varieties"
            git tag "$stamp"
          else
            git commit -m "relink $stamp: follow the upstream region register"
          fi
          git push origin HEAD
          if [ "$NEW_CROP" = "true" ]; then
            git push origin "$stamp"
          fi

      - name: Put it in the cellar
        if: steps.crop.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$stamp" seed-catalog.dat \
            --title "$stamp" \
            --notes "$count varieties."
